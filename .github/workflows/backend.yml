name: Backend PostgreSQL checks

on:
  pull_request:
    paths: ["src/backend/**", "src/frontend/**", "test/**", "docs/contracts/**", ".github/workflows/backend.yml"]
  push:
    branches: [main, "feature/**", "fix/**", "test/**"]
    paths: ["src/backend/**", "src/frontend/**", "test/**", "docs/contracts/**", ".github/workflows/backend.yml"]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: night_voyage
          POSTGRES_PASSWORD: ci-isolated-test-password
          POSTGRES_DB: night_voyage_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U night_voyage -d night_voyage_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: src/backend
    env:
      DATABASE_URL: postgresql+psycopg://night_voyage:ci-isolated-test-password@127.0.0.1:5432/night_voyage_test
      TEST_DATABASE_URL: postgresql+psycopg://night_voyage:ci-isolated-test-password@127.0.0.1:5432/night_voyage_test
      APP_SECRET: ci-only-isolated-database-secret-not-for-production
      NV_LIVE_FRONTEND: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/backend/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
        working-directory: src/frontend
      - run: python -m pip install -r requirements.lock
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python ../../test/run.py --suite backend --python python
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-report
          path: |
            test/reports/*/*.json
            test/reports/*/*.xml
            test/reports/*/*.log
          retention-days: 7
