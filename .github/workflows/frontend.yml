name: Frontend checks

on:
  pull_request:
    paths:
      - "src/frontend/**"
      - "test/**"
      - "docs/**"
      - ".github/workflows/frontend.yml"
  push:
    branches: [main, "feature/**", "fix/**", "docs/**", "test/**"]
    paths:
      - "src/frontend/**"
      - "test/**"
      - "docs/**"
      - ".github/workflows/frontend.yml"

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install pinned package manager
        run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: python ../../test/run.py --suite frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-test-report
          path: |
            test/reports/*/*.json
            test/reports/*/*.log
          retention-days: 7
