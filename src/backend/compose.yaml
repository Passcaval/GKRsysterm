name: night-voyage
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: night_voyage
      POSTGRES_USER: night_voyage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U night_voyage -d night_voyage"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
